<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearPass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3fd1'/%3E%3Cpath d='M9 16.5l5 5 9-11' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: player side is one narrow column, one task per screen. Analyst side is a queue + case file. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --fg: #0d1430; --muted: #47507a; --line: #c9cde0;
  --accent: #1f3fd1; --accent-fg: #ffffff; --focus: #ffd400;
  --ok: #0b6b3a; --ok-bg: #dff3e7; --low: #3d4a7a; --low-bg: #e6e9f5;
  --warn: #7a4a00; --warn-bg: #fdefc8; --bad: #9b1c1c; --bad-bg: #fbe0e0; --note-bg: #e8ebfa;
  --font: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0b0f22; --surface: #141a36; --fg: #f2f4ff; --muted: #b4bbe0; --line: #36406e;
  --accent: #8ea2ff; --accent-fg: #0b0f22;
  --ok: #7fe0a8; --ok-bg: #12321f; --low: #c3cbf5; --low-bg: #222a52;
  --warn: #ffd27a; --warn-bg: #3a2a08; --bad: #ff9c9c; --bad-bg: #3d1414; --note-bg: #1d2550;
  color-scheme: dark; } }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 1.0625rem; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1240px; margin: 0 auto; }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; }
h2 { font-size: 1.6rem; } h3 { font-size: 1.15rem; }
p { margin: 0; max-width: 68ch; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; background: var(--focus); color: #000; padding: 8px 12px; z-index: 10; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 7px #000; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
label.btn:has(+ input:focus-visible) { outline: 4px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 7px #000; } /* file input is hidden; show its focus on the visible label */

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-block: 18px; border-bottom: 2px solid var(--line); }
.brand { display: flex; flex-direction: column; }
.brand b { font-size: 1.45rem; }
.brand span { font-size: .9rem; color: var(--muted); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.banner { margin-block: 14px 24px; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: .95rem; }

button, .btn { font: inherit; font-weight: 700; font-size: 1rem; min-height: 48px; padding: 8px 18px; border-radius: 10px; border: 2px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.small { min-height: 40px; font-size: .92rem; padding: 6px 12px; }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Player flow */
.flow { max-width: 680px; display: flex; flex-direction: column; gap: 20px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; font-size: .9rem; color: var(--muted); }
.steps li { padding: 4px 10px; border: 2px solid var(--line); border-radius: 999px; }
.steps li[aria-current="step"] { border-color: var(--fg); color: var(--fg); font-weight: 700; }
.steps li.done { border-color: var(--ok); color: var(--ok); }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.choice { text-align: left; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 16px 18px; width: 100%; }
.choice small { font-weight: 400; color: var(--muted); font-size: 1rem; }
.choices { display: grid; gap: 12px; }
label { font-weight: 700; display: block; margin-bottom: 6px; }
.hint { font-size: .95rem; color: var(--muted); margin-top: 4px; }
input[type="text"], input[type="email"], input[type="date"], select, textarea { font: inherit; font-size: 1.05rem; width: 100%; min-height: 50px; padding: 10px 14px; border: 2px solid var(--fg); border-radius: 10px; background: var(--bg); color: var(--fg); }
textarea { font-family: var(--mono); font-size: .9rem; min-height: 260px; line-height: 1.5; }
input[aria-invalid="true"] { border-color: var(--bad); border-width: 3px; }
.err { color: var(--bad); font-weight: 700; font-size: .98rem; margin-top: 6px; }
.form-grid { display: grid; gap: 16px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; }
.check input { width: 24px; height: 24px; margin-top: 2px; flex: none; }
.cam { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; }
.cam video, .cam canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .frame { position: absolute; inset: 16% 12%; border: 4px dashed rgba(255,255,255,.7); border-radius: 14px; pointer-events: none; }
.cam .frame.good { border-style: solid; border-color: #3ee38a; }
.guide { font-size: 1.5rem; font-weight: 700; padding: 14px 18px; border-radius: 12px; background: var(--note-bg); border: 2px solid var(--accent); min-height: 3em; display: flex; align-items: center; }
img.shot { border-radius: 10px; border: 2px solid var(--line); max-width: 100%; }
.result { padding: 18px; border-radius: 14px; border: 3px solid var(--ok); background: var(--ok-bg); display: flex; flex-direction: column; gap: 8px; }

/* Analyst */
.summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.summary button { display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-width: 132px; font-weight: 400; }
.summary button b { font-family: var(--mono); font-size: 1.5rem; line-height: 1.1; }
.summary button[aria-pressed="true"] { border-width: 3px; border-color: var(--accent); }
.workbench { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: 22px; align-items: start; }
@media (max-width: 920px) { .workbench { grid-template-columns: minmax(0, 1fr); } }
.queue { display: flex; flex-direction: column; gap: 8px; max-height: 78vh; overflow-y: auto; padding: 10px; margin: -10px; } /* padding keeps the focus ring from being clipped */
.qitem { flex: none; text-align: left; width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; padding: 12px 14px; font-weight: 400; }
.qitem[aria-selected="true"] { border-color: var(--accent); border-width: 3px; }
.qitem .nm { font-weight: 700; }
.qitem .meta { font-size: .88rem; color: var(--muted); grid-column: 1 / -1; }
.pill { font-family: var(--mono); font-weight: 600; font-size: .85rem; padding: 2px 10px; border-radius: 999px; border: 2px solid; white-space: nowrap; align-self: start; }
.pill.clear { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.pill.low { color: var(--low); background: var(--low-bg); border-color: var(--low); }
.pill.medium { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
.pill.high { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
.score { font-family: var(--mono); font-size: 3rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: .85rem; }
.ladder div { border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--muted); }
.ladder div.on { border-color: var(--fg); color: var(--fg); font-weight: 700; }
.flags { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.flags li { border: 2px solid var(--line); border-left: 6px solid var(--bad); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.flags .fam { font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.flags .ev { color: var(--muted); font-size: .97rem; }
.pattern { border-radius: 10px; padding: 12px 14px; background: var(--bad-bg); border: 2px solid var(--bad); display: flex; flex-direction: column; gap: 4px; }
.pattern.med { background: var(--warn-bg); border-color: var(--warn); }
.note { border-radius: 10px; padding: 12px 14px; background: var(--note-bg); display: flex; flex-direction: column; gap: 6px; }
.tag { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.flow-map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .flow-map { grid-template-columns: minmax(0, 1fr); } }
.flow-map div { border: 2px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.flow-map .odd { color: var(--bad); font-weight: 700; }
.tablewrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: var(--note-bg); }
td.num, th.num { text-align: right; }
tr.hit td { background: var(--bad-bg); }
dl.ctx { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 16px; margin: 0; }
dl.ctx dt { color: var(--muted); } dl.ctx dd { margin: 0; font-weight: 700; }
svg.net { width: 100%; max-width: 520px; height: auto; display: block; }
.status { font-weight: 700; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.metric { border: 2px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.metric b { font-family: var(--mono); font-size: 2rem; line-height: 1; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>ClearPass</b><span>Accessible sign-up and pattern-based AML monitoring for OLG</span></div>
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-player" aria-selected="true" aria-controls="view-player">Player sign-up</button>
      <button role="tab" id="tab-analyst" aria-selected="false" aria-controls="view-analyst">Analyst workbench</button>
      <button role="tab" id="tab-validation" aria-selected="false" aria-controls="view-validation">Rule validation</button>
    </div>
    <label class="check" for="voice" style="margin:0"><input type="checkbox" id="voice" checked> App voice</label>
  </header>
  <p class="banner"><b>Prototype.</b> All players and transactions are synthetic. No real identity checks happen and nothing leaves this browser except speech recognition, which Chrome processes online.</p>

  <main id="main">
    <div id="live" class="sr" aria-live="assertive" aria-atomic="true"></div>
    <div id="polite" class="sr" aria-live="polite" aria-atomic="true"></div>

    <section id="view-player" role="tabpanel" aria-labelledby="tab-player">
      <div class="flow">
        <ol class="steps" id="stepper" aria-label="Progress"></ol>
        <div id="stage"></div>
      </div>
    </section>

    <section id="view-analyst" role="tabpanel" aria-labelledby="tab-analyst" hidden>
      <div class="summary" id="summary" role="group" aria-label="Filter by risk tier"></div>
      <div class="workbench">
        <div>
          <h2 class="sr">Case queue</h2>
          <div id="queue" class="queue" role="listbox" aria-label="Case queue, highest risk first. Use arrow keys to move, Enter to open."></div>
        </div>
        <div id="detail" class="panel" tabindex="-1"></div>
      </div>
    </section>

    <section id="view-validation" role="tabpanel" aria-labelledby="tab-validation" hidden>
      <div id="validation" class="flow" style="max-width:none"></div>
    </section>
  </main>
</div>

<script src="engine.js"></script>
<script src="voice-fill.js"></script>
<script src="app.js"></script>
</body>
</html>
